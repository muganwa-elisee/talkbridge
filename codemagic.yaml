
workflows:
  talkbridge-ios:
    name: TALKBRIDGE AI - iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: v22.11.0
      xcode: latest

    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Vue frontend
        script: |
          cd frontend
          npm run build

      - name: Synchronize Capacitor iOS project
        script: |
          cd frontend
          npx cap sync ios

      - name: Build unsigned iOS application
        script: |
          cd frontend/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
